name: Daily Free Models Update

on:
  schedule:
    # Every day at 12:00 UTC+8 = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch models
        run: python3 fetch_models.py

      - name: Commit and push
        run: |
          git config user.name "Oscar Studio Bot"
          git config user.email "bot@oscarstudio.cn"
          git add models-global.json models-cn.json
          git diff --staged --quiet || git commit -m "Update free models $(date +%Y-%m-%d)"
          git push